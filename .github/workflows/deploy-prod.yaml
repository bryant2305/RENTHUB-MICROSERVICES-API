name: Deploy Prod - Build and Push

on:
  push:
    branches:
      - main
    paths:
      - 'gateway/**'
      - 'auth-service/**'
      - 'user-service/**'
      - 'properties-service/**'
      - 'reservation-service/**'
      - 'mail-service/**'
  pull_request:
    branches:
      - main
    paths:
      - 'gateway/**'
      - 'auth-service/**'
      - 'user-service/**'
      - 'properties-service/**'
      - 'reservation-service/**'
      - 'mail-service/**'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      auth: ${{ steps.filter.outputs.auth }}
      user: ${{ steps.filter.outputs.user }}
      property: ${{ steps.filter.outputs.property }}
      reservation: ${{ steps.filter.outputs.reservation }}
      mail: ${{ steps.filter.outputs.mail }}
      # Variable para saber si al menos un servicio cambió y evitar levantar el matrix completo en vano
      any_changed: ${{ steps.filter.outputs.gateway == 'true' || steps.filter.outputs.auth == 'true' || steps.filter.outputs.user == 'true' || steps.filter.outputs.property == 'true' || steps.filter.outputs.reservation == 'true' || steps.filter.outputs.mail == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gateway:
              - 'gateway/**'
            auth:
              - 'auth-service/**'
            user:
              - 'user-service/**'
            property:
              - 'properties-service/**'
            reservation:
              - 'reservation-service/**'
            mail:
              - 'mail-service/**'

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            context: ./gateway
            changed: ${{ needs.detect-changes.outputs.gateway }}
          - service: auth
            context: ./auth-service
            changed: ${{ needs.detect-changes.outputs.auth }}
          - service: user
            context: ./user-service
            changed: ${{ needs.detect-changes.outputs.user }}
          - service: property
            context: ./properties-service
            changed: ${{ needs.detect-changes.outputs.property }}
          - service: reservation
            context: ./reservation-service
            changed: ${{ needs.detect-changes.outputs.reservation }}
          - service: mail
            context: ./mail-service
            changed: ${{ needs.detect-changes.outputs.mail }}

    steps:
      - name: Checkout code
        if: matrix.changed == 'true'
        uses: actions/checkout@v4

      - name: Generate short SHA
        if: matrix.changed == 'true'
        id: sha
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Login to GHCR
        if: matrix.changed == 'true' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: matrix.changed == 'true' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.service }}:${{ env.SHORT_SHA }}-prod
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.service }}:prod

  deploy:
    needs: [detect-changes, build]
    if: github.event_name == 'push' && needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Generate short SHA
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Checkout Infrastructure Repository
        uses: actions/checkout@v4
        with:
          repository: bryant2305/dep
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: infra-repo

      - name: Update Helm Values with new Image Tags
        run: |
          cd infra-repo
          
          # Se actualizan secuencialmente solo los servicios que cambiaron
          if [ "${{ needs.detect-changes.outputs.gateway }}" = "true" ]; then
            yq e ".services.gateway.image = \"ghcr.io/${{ env.IMAGE_OWNER }}/gateway:${{ env.SHORT_SHA }}-prod\"" -i helm/renthub-chart/values-prod.yaml
          fi
          
          if [ "${{ needs.detect-changes.outputs.auth }}" = "true" ]; then
            yq e ".services.auth.image = \"ghcr.io/${{ env.IMAGE_OWNER }}/auth:${{ env.SHORT_SHA }}-prod\"" -i helm/renthub-chart/values-prod.yaml
          fi
          
          if [ "${{ needs.detect-changes.outputs.user }}" = "true" ]; then
            yq e ".services.user.image = \"ghcr.io/${{ env.IMAGE_OWNER }}/user:${{ env.SHORT_SHA }}-prod\"" -i helm/renthub-chart/values-prod.yaml
          fi
          
          if [ "${{ needs.detect-changes.outputs.property }}" = "true" ]; then
            yq e ".services.property.image = \"ghcr.io/${{ env.IMAGE_OWNER }}/property:${{ env.SHORT_SHA }}-prod\"" -i helm/renthub-chart/values-prod.yaml
          fi
          
          if [ "${{ needs.detect-changes.outputs.reservation }}" = "true" ]; then
            yq e ".services.reservation.image = \"ghcr.io/${{ env.IMAGE_OWNER }}/reservation:${{ env.SHORT_SHA }}-prod\"" -i helm/renthub-chart/values-prod.yaml
          fi
          
          if [ "${{ needs.detect-changes.outputs.mail }}" = "true" ]; then
            yq e ".services.mail.image = \"ghcr.io/${{ env.IMAGE_OWNER }}/mail:${{ env.SHORT_SHA }}-prod\"" -i helm/renthub-chart/values-prod.yaml
          fi

          # Configurar Git y hacer Push único
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          git add helm/renthub-chart/values-prod.yaml
          git commit -m "chore: update deployed services images to ${{ env.SHORT_SHA }}-prod" || true
          git push origin main
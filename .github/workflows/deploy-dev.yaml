name: Deploy Dev - Build and Push

on:
  push:
    branches:
      - develop
    paths:
      - 'gateway/**'
      - 'auth-service/**'
      - 'user-service/**'
      - 'properties-service/**'
      - 'reservation-service/**'
      - 'mail-service/**'
  pull_request:
    branches:
      - develop
    paths:
      - 'gateway/**'
      - 'auth-service/**'
      - 'user-service/**'
      - 'properties-service/**'
      - 'reservation-service/**'
      - 'mail-service/**'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      auth: ${{ steps.filter.outputs.auth }}
      user: ${{ steps.filter.outputs.user }}
      property: ${{ steps.filter.outputs.property }}
      reservation: ${{ steps.filter.outputs.reservation }}
      mail: ${{ steps.filter.outputs.mail }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gateway:
              - 'gateway/**'
            auth:
              - 'auth-service/**'
            user:
              - 'user-service/**'
            property:
              - 'properties-service/**'
            reservation:
              - 'reservation-service/**'
            mail:
              - 'mail-service/**'

  build:
    needs: detect-changes
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            context: ./gateway
            changed: ${{ needs.detect-changes.outputs.gateway }}

          - service: auth
            context: ./auth-service
            changed: ${{ needs.detect-changes.outputs.auth }}

          - service: user
            context: ./user-service
            changed: ${{ needs.detect-changes.outputs.user }}

          - service: property
            context: ./properties-service
            changed: ${{ needs.detect-changes.outputs.property }}

          - service: reservation
            context: ./reservation-service
            changed: ${{ needs.detect-changes.outputs.reservation }}

          - service: mail
            context: ./mail-service
            changed: ${{ needs.detect-changes.outputs.mail }}

    steps:
      - name: Checkout code
        if: matrix.changed == 'true'
        uses: actions/checkout@v4

      - name: Generate short SHA
        if: matrix.changed == 'true'
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Login to GHCR
        if: matrix.changed == 'true' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: matrix.changed == 'true' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.service }}:${{ env.SHORT_SHA }}
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.service }}:latest

      - name: Print published image
        if: matrix.changed == 'true'
        run: |
          echo "Published:"
          echo "ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.service }}:${{ env.SHORT_SHA }}"
          echo "ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.service }}:latest"

      # --- NEW GITOPS DEPLOYMENT STEPS ---
      - name: Checkout Infrastructure Repository
        if: matrix.changed == 'true' && github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          repository: bryant2305/dep
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: infra-repo

      - name: Update Helm Values with new Image Tag
        if: matrix.changed == 'true' && github.event_name == 'push'
        run: |
          cd infra-repo
          
          # Use yq to update the image string in values-dev.yaml
          yq e ".services.${{ matrix.service }}.image = \"ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.service }}:${{ env.SHORT_SHA }}\"" -i helm/renthub-chart/values-dev.yaml
          
          # Set up Git user for commit
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # Commit and push the changes
          git add helm/renthub-chart/values-dev.yaml
          # We use git commit || true so the pipeline doesn't fail if the image tag is exactly the same
          git commit -m "chore: update ${{ matrix.service }} image to ${{ env.SHORT_SHA }}" || true
          
          # IMPORTANT: Make sure 'main' matches the default branch in your 'dep' repo
          git push origin main